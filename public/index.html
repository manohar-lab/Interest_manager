<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Interest Manager — Personal lending and interest management application for tracking loans and investments in Indian Rupees.">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Interest Manager</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- ─── App Container ─────────────────────────────────── -->
    <div id="app">

        <!-- ─── Header ────────────────────────────────────── -->
        <header id="app-header" class="app-header">
            <div class="header-content">
                <div class="header-logo">
                    <span class="logo-icon">₹</span>
                    <h1>Interest Manager</h1>
                </div>
                <div class="header-actions" id="header-actions">
                    <!-- Notification Bell -->
                    <button id="btn-notifications" class="icon-btn" title="Notifications" aria-label="Notifications" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span id="notification-badge" class="badge-dot" style="display: none;">0</span>
                    </button>
                    <!-- Security Settings -->
                    <button id="btn-security-settings" class="icon-btn" title="Security Settings" aria-label="Security Settings" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </button>
                    <!-- User Profile / Logout -->
                    <div id="user-profile-widget" class="user-widget" style="display: none;">
                        <span id="user-display-name" class="user-name"></span>
                        <span id="user-role-badge" class="role-badge"></span>
                        <button id="btn-logout" class="btn-sm btn-logout" title="Sign Out">Sign Out</button>
                    </div>
                    <div class="header-status" id="header-status">
                        <span class="status-dot"></span>
                    </div>
                </div>
            </div>
        </header>

        <!-- ─── Notification Drawer ───────────────────────── -->
        <div id="notification-drawer" class="drawer-overlay" style="display: none;">
            <div class="drawer-content">
                <div class="drawer-header">
                    <h3>Notifications</h3>
                    <div class="drawer-actions">
                        <button id="btn-mark-all-read" class="btn-text-sm">Mark all read</button>
                        <button id="btn-close-notifications" class="btn-close">&times;</button>
                    </div>
                </div>
                <div id="notification-list" class="notification-list">
                    <!-- Notifications rendered here -->
                </div>
            </div>
        </div>

        <!-- ─── Security Settings Modal ────────────────────── -->
        <div id="security-modal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>Security & Access</h3>
                    <button id="btn-close-security" class="btn-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="security-tabs">
                        <button class="sec-tab active" data-tab="password">Password</button>
                        <button class="sec-tab" data-tab="pin">PIN Quick Access</button>
                        <button class="sec-tab" data-tab="sessions">Sessions</button>
                    </div>
                    <div id="sec-tab-password" class="sec-tab-content active">
                        <form id="form-change-password">
                            <div class="form-group">
                                <label>Current Password</label>
                                <input type="password" id="input-cur-password" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>New Password (min 6 chars)</label>
                                <input type="password" id="input-new-password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Update Password</button>
                        </form>
                    </div>
                    <div id="sec-tab-pin" class="sec-tab-content" style="display: none;">
                        <form id="form-change-pin">
                            <div class="form-group">
                                <label id="pin-cred-label">Current Password or PIN</label>
                                <input type="password" id="input-pin-cred" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>New PIN (4–6 digits)</label>
                                <input type="password" id="input-new-pin" class="form-control" maxlength="6" pattern="[0-9]{4,6}" placeholder="4 to 6 digits" required>
                            </div>
                            <div class="form-group">
                                <label>Confirm New PIN</label>
                                <input type="password" id="input-confirm-pin" class="form-control" maxlength="6" pattern="[0-9]{4,6}" placeholder="Confirm digits" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Save PIN</button>
                        </form>
                    </div>
                    <div id="sec-tab-sessions" class="sec-tab-content" style="display: none;">
                        <p class="text-muted">Active authenticated sessions are automatically revoked on logout or password change.</p>
                        <div id="session-info-box" class="info-card"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ─── Main Content Area ─────────────────────────── -->
        <main id="main-content" class="main-content">
            <!-- Dynamic page content rendered here by router -->
        </main>

        <!-- ─── Floating Action Button ────────────────────── -->
        <button id="fab-add" class="fab" aria-label="Add new transaction">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>

        <!-- ─── Bottom Navigation ─────────────────────────── -->
        <nav id="bottom-nav" class="bottom-nav">
            <a href="#/dashboard" class="nav-item active" data-route="dashboard" id="nav-dashboard">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                </svg>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="#/people" class="nav-item" data-route="people" id="nav-people">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span class="nav-label">People</span>
            </a>
            <a href="#/accounts" class="nav-item" data-route="accounts" id="nav-accounts">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                    <line x1="2" y1="10" x2="22" y2="10"></line>
                </svg>
                <span class="nav-label">Accounts</span>
            </a>
            <a href="#/transactions" class="nav-item" data-route="transactions" id="nav-transactions">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
                <span class="nav-label">Transactions</span>
            </a>
            <a href="#/due" class="nav-item" data-route="due" id="nav-due">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span class="nav-label">Due</span>
            </a>
            <a href="#/reports" class="nav-item" data-route="reports" id="nav-reports">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                <span class="nav-label">Reports</span>
            </a>
        </nav>

    </div>

    <script src="/js/app.js"></script>
</body>
</html>
